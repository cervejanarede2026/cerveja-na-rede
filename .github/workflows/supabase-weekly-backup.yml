name: Supabase Weekly Backup

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Export Supabase tables and encrypt backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" || -z "${BACKUP_ENCRYPTION_KEY:-}" ]]; then
            echo "One or more required GitHub Secrets are missing."
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          TABLES=(fixed_players fixed_state group_members group_state groups)

          for table in "${TABLES[@]}"; do
            echo "Exporting table: $table"
            pages="$WORKDIR/${table}.pages"
            : > "$pages"
            offset=0

            while true; do
              end=$((offset + 999))
              curl --fail --silent --show-error --get \
                "${SUPABASE_URL%/}/rest/v1/$table" \
                --data-urlencode "select=*" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Range-Unit: items" \
                -H "Range: $offset-$end" \
                -o "$WORKDIR/page.json"

              if ! jq -e 'type == "array"' "$WORKDIR/page.json" >/dev/null; then
                echo "Unexpected response while exporting $table."
                exit 1
              fi

              count="$(jq 'length' "$WORKDIR/page.json")"
              jq -c . "$WORKDIR/page.json" >> "$pages"

              if (( count < 1000 )); then
                break
              fi
              offset=$((offset + 1000))
            done

            jq -s 'add // []' "$pages" > "$WORKDIR/$table.json"
            echo "Exported $(jq 'length' "$WORKDIR/$table.json") rows from $table."
          done

          printf 'Backup created at (UTC): %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$WORKDIR/README.txt"
          tar -czf "$RUNNER_TEMP/supabase-backup.tar.gz" -C "$WORKDIR" .

          BACKUP_DATE="$(date -u +'%Y-%m-%d')"
          openssl enc -aes-256-cbc -e -salt -pbkdf2 -iter 200000 -md sha256 \
            -pass env:BACKUP_ENCRYPTION_KEY \
            -in "$RUNNER_TEMP/supabase-backup.tar.gz" \
            -out "$RUNNER_TEMP/supabase-backup-$BACKUP_DATE.tar.gz.enc"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/supabase-backup-*.tar.gz.enc
          if-no-files-found: error
          retention-days: 90
